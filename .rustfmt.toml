# Rush Rust formatting configuration
# Based on Linux kernel Rust formatting rules
#
# Reference: https://github.com/torvalds/linux/blob/master/.rustfmt.toml

edition = "2021"
newline_style = "Unix"

# Unstable options that help catching formatting mistakes
# Enable when they become stable
#format_code_in_doc_comments = true
#reorder_impl_items = true
#comment_width = 100
#wrap_comments = true
#normalize_comments = true
