[package]
name = "rush"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "A blazingly fast build system - spiritual successor to Bazel, written in Rust"
repository = "https://github.com/mcgrof/rush"

[workspace]
members = [
    "crates/rush-graph",
    "crates/rush-action",
    "crates/rush-exec",
    "crates/rush-sandbox",
    "crates/rush-cache",
    "crates/rush-remote",
    "crates/rush-resource",
    "crates/rush-build",
    "crates/rush-parse",
    "crates/rush-cli",
    "crates/rush-server",
    "crates/rush-repo",
    "crates/rush-workspace",
    "crates/rush-starlark",
    "crates/rush-rules",
    "crates/rush-profiling",
    "crates/rush-verified-core",
    "crates/rush-protocol",
    "crates/rush-command-core",
    "crates/rush-incremental",
    "crates/rush-observe",
    "crates/rush-transport-grpc",
    "crates/tensorflow-rules",
]

[dependencies]
rush-cli = { path = "crates/rush-cli" }
rush-resource = { path = "crates/rush-resource" }
rush-starlark = { path = "crates/rush-starlark" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
ctrlc = "3.4"
dhat = { version = "0.3", optional = true }

[[bin]]
name = "rush"
path = "src/main.rs"

[[bin]]
name = "rushtop"
path = "src/bin/rushtop.rs"

[[example]]
name = "simple_action"
path = "examples/simple_action.rs"

[[example]]
name = "envoy_build_test"
path = "examples/envoy_build_test.rs"

[[example]]
name = "http_archive_example"
path = "examples/http_archive_example.rs"

[[example]]
name = "envoy_workspace_test"
path = "examples/envoy_workspace_test.rs"

[dev-dependencies]
rush-action = { path = "crates/rush-action" }
rush-cache = { path = "crates/rush-cache" }
rush-exec = { path = "crates/rush-exec" }
rush-parse = { path = "crates/rush-parse" }
rush-build = { path = "crates/rush-build" }
rush-repo = { path = "crates/rush-repo" }
rush-graph = { path = "crates/rush-graph" }
tempfile.workspace = true
serde_json.workspace = true
libc.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }
rayon.workspace = true
blake3.workspace = true

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Concurrency
dashmap = "6.0"
rayon = "1.10"
parking_lot = "0.12"
once_cell = "1.20"
crossbeam = "0.8"
num_cpus = "1.16"

# System calls
libc = "0.2"

# Random
rand = "0.8"

# Hashing & crypto
blake3 = { version = "1.5", features = ["serde"] }
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Terminal colors
owo-colors = "4.0"

# Progress bars
indicatif = "0.17"

# Remote execution (gRPC)
tonic = "0.12"
prost = "0.13"
prost-build = "0.13"
bytes = "1.7"
protoc-bin-vendored = "3.0"

# Linux process, filesystem, sandbox, and observation system calls
nix = { version = "0.29", features = ["process", "mount", "sched", "resource", "fs", "user", "ptrace", "signal"] }

# Filesystem
tempfile = "3.10"
walkdir = "2.5"
notify = "6.1"
inotify = "0.9"
memmap2 = "0.9"

# Text processing
regex = "1.10"

# Compression
flate2 = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Starlark interpreter
starlark = "0.12"

[[bench]]
name = "bench_parsing"
harness = false

[[bench]]
name = "bench_build_performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 1

[features]
heap-profile = ["dhat"]
profile = [
    "rush-parse/profile",
    "rush-starlark/profile",
    # The build phases themselves: without these the report covers only
    # parsing, which is not where an incremental build spends its time.
    "rush-build/profile",
]
