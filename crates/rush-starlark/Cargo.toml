[package]
name = "rush-starlark"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "Starlark parser and evaluator for Rush build system"

[features]
default = []
bzl-debug = []
profile = ["rush-profiling/enabled"]

[dependencies]
rush-profiling = { path = "../rush-profiling" }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
walkdir = "2.4"
rush-resource = { path = "../rush-resource" }
rush-incremental = { path = "../rush-incremental" }
tokio = { workspace = true }
futures = "0.3"
lru = "0.12"
dashmap = { workspace = true }
num_cpus = "1.16"
sha2 = "0.10"
blake3 = { workspace = true }
hex = "0.4"
once_cell = "1.20"
regex = "1.10"
rush-repo = { path = "../rush-repo" }

[dev-dependencies]
tempfile = "3.8"
libc = { workspace = true }
