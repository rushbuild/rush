[package]
name = "rush-server"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "Build server daemon"

[dependencies]
rush-build = { path = "../rush-build" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = "1.0"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing.workspace = true
