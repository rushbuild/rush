[package]
name = "rush-transport-grpc"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "tonic/gRPC-over-Unix-domain-socket transport adapter for the rush persistent daemon: a server hosting a dyn CommandService and a thin client, with cookie auth and metadata-file discovery. Additive; not wired into the rush CLI."
repository = "https://github.com/mcgrof/rush"

[dependencies]
rush-protocol = { path = "../rush-protocol" }
rush-command-core = { path = "../rush-command-core" }

tonic = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = { workspace = true }
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }

serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
