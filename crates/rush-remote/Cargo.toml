[package]
name = "rush-remote"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "Remote execution and caching client"

[dependencies]
rush-action = { path = "../rush-action" }
rush-exec = { path = "../rush-exec" }
anyhow.workspace = true
tonic = { workspace = true, features = ["tls-native-roots"] }
reqwest = { version = "0.11", features = ["json"] }
bincode = "1.3"
tokio.workspace = true
serde.workspace = true
async-trait.workspace = true
blake3.workspace = true
prost.workspace = true
prost-types = "0.13"
sha2.workspace = true
rand.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio-stream = "0.1"

[build-dependencies]
prost-build.workspace = true
tonic-build = "0.12"
protoc-bin-vendored.workspace = true
