[package]
name = "rush-parse"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "BUILD file parser (Starlark subset)"

[dependencies]
anyhow.workspace = true
starlark.workspace = true
serde = { workspace = true }
dashmap.workspace = true
once_cell.workspace = true
regex = "1.10"
glob = "0.3"
rush-starlark = { path = "../rush-starlark" }
rush-incremental = { path = "../rush-incremental" }
rush-profiling = { path = "../rush-profiling" }
lru = "0.12"
parking_lot.workspace = true

[features]
profile = ["rush-profiling/enabled"]

[dev-dependencies]
tempfile.workspace = true
walkdir = "2.5"
