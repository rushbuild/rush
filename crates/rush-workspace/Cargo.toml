[package]
name = "rush-workspace"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "External workspace and dependency management"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
zip = "0.6"
blake3 = "1.5"
walkdir = "2.4"

[dependencies.git2]
version = "0.19"
default-features = false
features = ["https"]

[dependencies.bzip2]
version = "0.4"

[dev-dependencies]
tempfile = "3.8"
