[package]
name = "rush-rules"
version = "0.1.0"
edition = "2021"
authors = ["Luis Chamberlain <mcgrof@kernel.org>"]
license = "MIT"
description = "Extensible build rule plugin system for Rush"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rush-action = { path = "../rush-action" }
rush-verified-core = { path = "../rush-verified-core" }
rush-incremental = { path = "../rush-incremental" }
rush-command-core = { path = "../rush-command-core" }
blake3 = "1.5"
rayon = "1.10"
futures = "0.3"

[dev-dependencies]
tempfile = "3.8"
