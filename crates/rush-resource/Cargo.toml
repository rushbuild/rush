[package]
name = "rush-resource"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Resource management for Rush build system"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# PSI monitoring requires Linux-specific features
